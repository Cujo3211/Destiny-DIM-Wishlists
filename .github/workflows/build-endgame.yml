name: Build Endgame Wishlist

on:
  push:
    paths:
      - 'payload/endgame.part*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode wishlist
        run: |
          cat payload/endgame.part* | base64 -d > /tmp/endgame.txt.gz
          gzip -dc /tmp/endgame.txt.gz > Endgame.txt
      - name: Commit generated wishlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Endgame.txt
          git diff --cached --quiet || git commit -m "Build Endgame DIM wishlist"
          git push
